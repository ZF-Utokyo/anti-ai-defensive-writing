name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Check Skill and prompt policy sync
        run: python scripts/check_policy_sync.py
