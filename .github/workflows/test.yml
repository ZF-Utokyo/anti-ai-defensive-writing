name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test safe installer
        run: node --test tests/test_installer.mjs
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Check Skill and prompt policy sync
        run: python scripts/check_policy_sync.py
      - name: Verify npm package contents
        run: npm pack --dry-run
